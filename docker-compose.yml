services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/etf_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      TZ: Asia/Shanghai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: etf-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
